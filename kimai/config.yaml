name: Kimai
version: "2.67.0.11"
slug: kimai
description: Self-hosted time tracking for freelancers and teams, with a bundled database.
url: https://github.com/FaliseDotCom/ha-kimai/tree/main/kimai
homeassistant: 2026.7.0
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 60
backup: cold
map:
  - app_config:rw
ports:
  8001/tcp: 8001
webui: http://[HOST]:[PORT:8001]
watchdog: tcp://[HOST]:[PORT:8001]
options:
  admin_email: ""
  admin_password: ""
  trusted_hosts: ""
  trusted_proxies: 127.0.0.1,172.30.32.0/23
schema:
  admin_email: str?
  admin_password: password?
  trusted_hosts: str?
  trusted_proxies: str?
  mailer_from: email?
  mailer_url: password?
